      const set = S.cards.filter(c => c.status === 'set');
      const text = 'Worry Time: today\n' + set.map(c => `☐ ${c.solution.trim()}  (${pileName(c.pile)}: ${c.text})`).join('\n');
      const fallback = () => { ui.copyText = text; render(); };
      try {
        navigator.clipboard.writeText(text).then(() => toast('List copied'), fallback);
      } catch (e) { fallback(); }
    },
    ciWorry: b => {
      const form = b.closest('form');
      ui.logDraft = Object.assign(draftFrom(form), { worry: b.dataset.v === '1' });
      form.querySelectorAll('[data-act="ciWorry"]').forEach(x => x.setAttribute('aria-pressed', x === b));
    },
    ciMinutes: b => { const inp = b.closest('form').querySelector('[data-field="ciMin"]'); inp.value = b.dataset.m; },
    bedAnother: () => { ui.bedsideSaved = false; ui.focus = '#bedText'; render(); },
    clearAsk: () => { ui.confirmClear = true; render(); },
    clearCancel: () => { ui.confirmClear = false; render(); },
    clearAll: () => { S = fresh(); ui.confirmClear = false; ui.logDraft = null; save(); render(); toast('All data deleted'); }
  };

  function draftFrom(form) {
    const key = form.dataset.key;
    const pressed = form.querySelector('[data-act="ciWorry"][aria-pressed="true"]');
    const entry = S.nights[key] || {};
    const min = form.querySelector('[data-field="ciMin"]').value;
    return { key, worry: pressed ? pressed.dataset.v === '1' : (entry.worry ?? null), minutes: min };
  }

  function addPile(name) {
    name = (name || '').trim();
    if (!name) return;
    if (S.piles.length >= MAX_PILES) { toast('Seven piles is the limit. Merge some instead.'); return; }
    if (S.piles.some(p => p.name.toLowerCase() === name.toLowerCase())) { toast('You already have that pile'); return; }
    S.piles.push({ id: uid(), name });
    save(); ui.focus = '#pileName'; render();
  }

  const forms = {
    addCard: () => {
      const s = currentSession(); const ta = $('#newCard');
      const text = ta.value.trim();
      if (!s || !text) { ta.focus(); return; }
      S.cards.push({ id: uid(), text, created: Date.now(), source: 'session', status: 'active', sessionId: s.id, pile: null, kind: null, solution: '', worst: {}, worstOpen: false, history: [] });
      save(); ui.focus = '#newCard'; render();
    },
    addPile: () => addPile($('#pileName').value),
    retry: f => {
      const c = cardById(f.dataset.id); if (!c) return;
      c.history.push({ solution: c.solution, kind: c.kind, note: f.querySelector('textarea').value.trim(), at: Date.now() });
      c.solution = ''; c.status = 'waiting'; c.setAt = null; c.worstOpen = false;
      delete ui.retryOpen[c.id];
      save(); render(); toast('It’ll be in tonight’s pile');
    },
    bedside: () => {
      const ta = $('#bedText'); const text = ta.value.trim();
      if (!text) { ta.focus(); return; }
      S.cards.push({ id: uid(), text, created: Date.now(), source: 'bedside', status: 'waiting', sessionId: null, pile: null, kind: null, solution: '', worst: {}, worstOpen: false, history: [] });
      ui.bedsideSaved = true; save(); render();
    },
    checkin: f => {
      const d = draftFrom(f);
      const min = d.minutes === '' ? null : Math.max(0, Math.min(600, Math.round(+d.minutes)));
      if (d.worry == null) { toast('Choose yes or no for worry time'); return; }
      if (min == null || Number.isNaN(min)) { toast('Add your best guess in minutes'); f.querySelector('[data-field="ciMin"]').focus(); return; }
      S.nights[d.key] = { worry: d.worry, minutes: min };
      ui.logDraft = null;
      save(); render(); toast('Night saved');
    }
  };

  /* ===================== Event wiring ===================== */
  const app = $('#app');
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || !app.contains(b) || b.disabled) return;
    const fn = acts[b.dataset.act];
    if (fn) { e.preventDefault(); fn(b, e); }
  });
  app.addEventListener('submit', e => {
    e.preventDefault();
    const fn = forms[e.target.dataset.form];
    if (fn) fn(e.target);
  });
  app.addEventListener('keydown', e => {
    if (editCard(e.target)) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); e.target.blur(); }
      else if (e.key === 'Escape') { e.target.textContent = e.target.dataset.orig || ''; e.target.blur(); }
      return;
    }
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && (e.target.id === 'newCard' || e.target.id === 'bedText')) {
      e.preventDefault(); e.target.form.requestSubmit();
    }
  });
  const editCard = t => t && t.dataset && t.dataset.edit === 'text' ? cardById(t.dataset.id) : null;
  app.addEventListener('focusin', e => { const c = editCard(e.target); if (c) e.target.dataset.orig = c.text; });
  app.addEventListener('focusout', e => {
    const t = e.target, c = editCard(t); if (!c) return;
    const v = t.textContent.trim();
    if (!v) { c.text = t.dataset.orig || c.text; toast('A card can’t be blank, so the old wording is back.'); }
    else c.text = v;
    t.textContent = c.text;
    save();
  });
  app.addEventListener('paste', e => {
    if (!editCard(e.target) || CE === 'plaintext-only') return;
    e.preventDefault();
    document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text/plain'));
  });
  app.addEventListener('input', e => {
    const t = e.target;
    const ec = editCard(t);
    if (ec) { ec.text = t.textContent; saveSoon(); return; }
    const f = t.dataset.field;
    if (f === 'solution' || (f && f.startsWith('worst.'))) {
      const c = cardById(t.dataset.id); if (!c) return;
      if (f === 'solution') {
        c.solution = t.value;
        const s = currentSession();
        if (s) {
          const cards = activeCards(s), d = cards.filter(answered).length;
          const p = $('#progress'); if (p) p.innerHTML = progressInner(d, cards.length);
          const l = $('#leftHint'); if (l) l.textContent = leftHint(cards.length - d);
        }
      } else {
        c.worst[f.slice(6)] = t.value;
      }
      saveSoon();
    }
  });
  app.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.setting) {
      if (!t.value) return;
      S.settings[t.dataset.setting] = t.value; save(); render();
    } else if (t.id === 'logDate' && t.value) {
      const e2 = S.nights[t.value];
      ui.logDraft = e2 ? { key: t.value, worry: e2.worry, minutes: e2.minutes }
        : { key: t.value, worry: S.sessions.some(s => s.endedAt && s.nightKey === t.value) ? true : null, minutes: '' };
      render();
    }
  });
  app.addEventListener('toggle', e => {
    const d = e.target;
    if (d.classList && d.classList.contains('worst')) { const c = cardById(d.dataset.id); if (c) { c.worstOpen = d.open; saveSoon(); } }
  }, true);
  window.addEventListener('hashchange', render);
  window.addEventListener('beforeunload', save);
  let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (route() === 'log') drawChart(); }, 120); });

  render();
})();
</script>
</body>
</html>
